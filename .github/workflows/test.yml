name: Verificar PWA
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar archivos y calculos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          html=Path('index.html').read_text()
          manifest=json.loads(Path('manifest.webmanifest').read_text())
          assert manifest['display']=='standalone'
          assert 'serviceWorker.register' in html
          assert 'Math.min(h1,40)+Math.min(h2,40)' in html
          assert 'Math.max(0,h1-40)+Math.max(0,h2-40)' in html
          for file in ('sw.js','icon.svg'): assert Path(file).is_file()
          def pay(h1,h2,rate):
              return (min(h1,40)+min(h2,40))*rate+(max(h1-40,0)+max(h2-40,0))*rate*1.5
          assert pay(45,0,15)==712.5
          assert pay(45,45,15)==1425
          assert pay(50,30,15)==1275
          print('Validaciones correctas')
          PY